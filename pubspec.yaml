name: arank_admin
description: "ARank India Admin Panel"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.0.0
  provider: ^6.1.5+1
  go_router: ^16.0.0
  spreadsheet_decoder: ^2.2.0
  file_picker: ^10.3.2
  archive: ^3.6.1
  excel: ^4.0.6
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/arank_logo.svg
